services:
  llama:
    build: .
    image: jetson-llama-cuda:local
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      - ./models:/models:ro
    # No published ports: llama-server is reachable only from Open WebUI.
    # Model selection lives in .env (MODEL_FILE, MODEL_NAME, CONTEXT_SIZE).
    command:
      - -m
      - /models/${MODEL_FILE:-SmolLM2-135M-Instruct-f16.gguf}
      - --alias
      - ${MODEL_NAME:-SmolLM2 135M Instruct}
      - -ngl
      - "99"
      - -c
      - "${CONTEXT_SIZE:-4096}"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    networks:
      - llama-net
    restart: unless-stopped
    # llama-server returns 503 on /health while the model loads, 200 once ready.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s

  open-webui:
    # Official slim image: no Ollama, CUDA runtime, or bundled local models.
    image: ghcr.io/open-webui/open-webui:main-slim@sha256:85d0453be8ca086896ddcc496190ad5a78f79d6e15f4be8c0fb80e4a9aaba2b0
    environment:
      OPENAI_API_BASE_URL: http://llama:8080/v1
      OPENAI_API_KEY: unused
      ENABLE_OPENAI_API: "true"
      ENABLE_OLLAMA_API: "false"
      OFFLINE_MODE: "true"
      HF_HUB_OFFLINE: "1"
      RAG_EMBEDDING_ENGINE: openai
      AUDIO_STT_ENGINE: openai
      UVICORN_WORKERS: "1"
      # Built-in tool schemas exceed the small model context even for a greeting.
      DEFAULT_MODEL_METADATA: '{"capabilities":{"builtin_tools":false,"usage":true}}'
      DEFAULT_MODEL_PARAMS: '{"system": "You are SmolLM2 135M Instruct, running locally on the user''s NVIDIA Jetson Orin Nano 8GB. Open WebUI is your chat interface and llama.cpp runs inference with CUDA on the Jetson GPU. This chat does not use a cloud inference service. You cannot inspect the machine or network yourself. Answer directly and concisely; do not invent deployment details."}'
      WEBUI_AUTH: "true"
      WEBUI_SECRET_KEY_FILE: /app/backend/data/.webui_secret_key
    ports:
      - "${WEBUI_BIND_ADDRESS:-0.0.0.0}:3000:8080"
    volumes:
      - open-webui:/app/backend/data
    mem_limit: 1g
    depends_on:
      llama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - llama-net
    restart: unless-stopped

volumes:
  open-webui:

networks:
  llama-net:
    driver: bridge
